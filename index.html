<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: #E0E0E0; /* Light text for contrast on dark background */
            overflow: hidden; /* Prevent scrollbar due to video */
        }

        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            background-size: cover;
            filter: brightness(0.4); /* Darken the video for better text readability */
        }

        .header {
            background-color: rgba(30, 30, 30, 0.8); /* Darker, semi-transparent header */
            color: white;
            padding: 12px 16px;
            text-align: center;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
        }

        .header img {
            height: 35px; /* Adjust logo size */
            margin-right: 10px;
            border-radius: 50%; /* Make logo round */
        }

        .container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px); /* Adjust height for header */
            max-width: 450px; /* Slightly wider container */
            margin: 30px auto; /* More vertical margin */
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            background-color: rgba(40, 40, 40, 0.9); /* Semi-transparent dark background for chat */
            overflow: hidden;
        }

        .chatbox {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px; /* More space between messages */
            scroll-behavior: smooth;
        }

        .chatbox::-webkit-scrollbar {
            width: 8px;
        }

        .chatbox::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .chatbox::-webkit-scrollbar-thumb {
            background-color: #6200EA; /* Purple 500 */
            border-radius: 10px;
            border: 2px solid rgba(40, 40, 40, 0.9);
        }

        .chat-message {
            padding: 12px 18px;
            border-radius: 25px; /* More rounded */
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.4s ease forwards;
            font-size: 15px;
            line-height: 1.5;
        }
        .user-message {
            align-self: flex-end;
            background-color: #6200EA; /* Purple 500 */
            color: white;
            border-bottom-right-radius: 5px; /* Sharper corner on user side */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .assistant-message {
            align-self: flex-start;
            background-color: #333333; /* Dark grey for assistant */
            color: #E0E0E0;
            border-bottom-left-radius: 5px; /* Sharper corner on assistant side */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .input-area {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(30, 30, 30, 0.9);
            display: flex;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            margin-right: 12px;
            background-color: #282828; /* Even darker input field */
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .input-area input::placeholder {
            color: #9E9E9E;
        }
        .input-area input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #6200EA; /* Purple focus ring */
            background-color: #333333;
        }
        .input-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background-color: #6200EA; /* Purple 500 */
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 15px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .input-area button:hover {
            background-color: #7B1FA2; /* Darker Purple for hover */
            transform: translateY(-1px);
        }
        .input-area button:active {
            transform: translateY(0);
        }
        .input-area .material-icons {
            margin-right: 7px;
            font-size: 20px;
        }
        .spinner {
            display: none;
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border-top-color: #6200EA;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <video autoplay muted loop class="video-background">
        <source src="background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="header">
        <img src="logo.png" alt="Bot Logo">
        Hyper Bot
    </div>
    <div class="container">
        <div id="chatbox" class="chatbox"></div>
        <div class="input-area">
            <input id="chatInput" type="text" placeholder="Ask me anything..." />
            <button id="sendButton">
                <span class="material-icons">send</span> Send
            </button>
        </div>
    </div>

    <script>
        const sendButton = document.getElementById("sendButton");
        const chatInput = document.getElementById('chatInput');
        const chatbox = document.getElementById('chatbox');

        async function displayMessage(message, isUser) {
            const msgElem = document.createElement('div');
            msgElem.textContent = message;
            msgElem.className = `chat-message ${isUser ? 'user-message' : 'assistant-message'}`;
            chatbox.appendChild(msgElem);
            chatbox.scrollTop = chatbox.scrollHeight; // Scroll to the bottom
            
            // For assistant messages, add a slight delay before displaying
            if (!isUser) {
                msgElem.style.opacity = 0; // Start with opacity 0
                await new Promise(resolve => setTimeout(resolve, 300)); // Delay
                msgElem.style.opacity = 1; // Fade in
            }
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            displayMessage(message, true);
            chatInput.value = '';

            const apiUrl = message.startsWith('/image') ? 
                'https://backend.buildpicoapps.com/aero/run/image-generation-api?pk=v1-Z0FBQUFBQm5HUEtMSjJkakVjcF9IQ0M0VFhRQ0FmSnNDSHNYTlJSblE0UXo1Q3RBcjFPcl9YYy1OZUhteDZWekxHdWRLM1M1alNZTkJMWEhNOWd4S1NPSDBTWC12M0U2UGc9PQ==' : 
                'https://backend.buildpicoapps.com/aero/run/llm-api?pk=v1-Z0FBQUFBQm5HUEtMSjJkakVjcF9IQ0M0VFhRQ0FmSnNDSHNYTlJSblE0UXo1Q3RBcjFPcl9YYy1OZUhteDZWekxHdWRLM1M1alNZTkJMWEhNOWd4S1NPSDBTWC12M0U2UGc9PQ==';

            chatInput.placeholder = "Typing...";
            chatInput.disabled = true;
            sendButton.disabled = true;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: message})
                });
                const data = await response.json();

                if (data.status === 'success') {
                    displayMessage(data.text, false);
                } else {
                    displayMessage('An error occurred. Please try again.', false);
                } 
            } catch (error) {
                console.error('Error:', error);
                displayMessage('An error occurred. Please try again.', false);
            } finally {
                chatInput.value = "";
                chatInput.placeholder = "Ask me anything...";
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.focus();
            }
        }

        chatInput.focus();

        sendButton.addEventListener('click', sendMessage);

        chatInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
